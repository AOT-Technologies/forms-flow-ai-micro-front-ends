name: forms-flow-components-CD
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
      - release/*
    paths:
      - "forms-flow-components/**"
      - "VERSION"
defaults:
  run:
    shell: bash
jobs:
  build:

    permissions:
      contents: read
      id-token: write

    name: Build and push artifacts to s3
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
      - name: Set version
        if: ${{ github.ref != 'refs/heads/main' }}
        working-directory: .
        run: |
          VER=$(cat VERSION)
          echo "VERSION=$VER" >> $GITHUB_ENV
          
      - name: Set version
        if: ${{ github.ref == 'refs/heads/main' }}
        working-directory: .
        run: |
          VER=$(cat VERSION)
          VER=${VER/-alpha/''}
          echo "VERSION=$VER" >> $GITHUB_ENV

        #TODO: force installing due to dependency conflict need to resolve the dependency
      - run: npm ci --force
        working-directory: ./forms-flow-components
      # - name: Run Tests
      #   run: npm run test
        # working-directory: ./forms-flow-components
        #continue-on-error: false    this line commented for force push because some test cases are failing
      - run: npm run build:webpack
        working-directory: ./forms-flow-components
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_OIDC_S3_ROLE_ARN }}
          aws-region: ${{ secrets.S3_REGION }}
      - run: npm ci
        working-directory: ./scripts
      - run: node index forms-flow-components
        env:
          BUCKET: ${{ secrets.BUCKET}}
          VERSION: ${{ env.VERSION }}
        working-directory: ./scripts
