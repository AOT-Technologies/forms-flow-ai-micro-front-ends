# =============================================================================
# Dependabot configuration — forms-flow-ai-micro-front-ends
# -----------------------------------------------------------------------------
# Review tiers (see .github/DEPENDABOT.md and .github/workflows/dependabot-triage.yml)
#
#   patch-only-safe  ONE grouped PR across all npm packages, patch bumps only.
#                    Title: "Bump the patch-only-safe group across N directories
#                    with M updates" → badge [✅ PATCH-ONLY]. One review pass, merge.
#   minor / major    Individual PRs (one per dependency per package) → badges
#                    [🟡 MINOR] / [🔴 MAJOR]. Reviewed deliberately.
#   security-fixes   ONE grouped PR for Dependabot security updates →
#                    badge [🔒 SECURITY]. Always on the default branch.
#
# Repo facts this file encodes:
#   - 8 independently installed MFE packages + /scripts (CD helper). NOT a
#     workspace monorepo: each directory has its own package-lock.json.
#   - Version drift between packages is intentional (jest 27/29, eslint 7/8,
#     i18next 21/23/25). React, webpack, single-spa and formio are frozen by
#     policy (CLAUDE.md "Hard Constraints"). Those majors are ignored below so
#     they never show up as noise; lift an ignore when an upgrade is planned.
#   - Default branch is `develop`; no target-branch is set on purpose, because
#     security updates only ever target the default branch and a non-default
#     target-branch silently detaches the groups/labels from them.
#
# Manual refresh: Insights → Dependency graph → Dependabot → "Check for updates".
# Validation:     Insights → Dependency graph → Dependabot (shows config errors).
# =============================================================================
version: 2

updates:
  # ===========================================================================
  # npm — all micro-frontend packages + CD scripts, in ONE update job so the
  # patch group spans every directory ("across N directories").
  # ===========================================================================
  - package-ecosystem: "npm"
    directories:
      - "/forms-flow-admin"
      - "/forms-flow-components"
      - "/forms-flow-integration"
      - "/forms-flow-nav"
      - "/forms-flow-review"
      - "/forms-flow-service"
      - "/forms-flow-submissions"
      - "/forms-flow-theme"
      - "/scripts"

    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Asia/Kolkata"

    # Grouped patch PR + individual minor/major PRs can exceed the default of 5.
    open-pull-requests-limit: 10

    # Bump the range in package.json AND the lockfile (app behaviour). Without
    # this Dependabot may treat non-private packages as libraries and "widen"
    # ranges instead of bumping them.
    versioning-strategy: "increase"

    # Supply-chain cooldown: never take a release the day it is published.
    # Most malicious npm publishes are yanked within days; waiting costs little.
    cooldown:
      default-days: 7
      semver-patch-days: 7
      semver-minor-days: 14
      semver-major-days: 30

    # Labels must already exist in the repo (unknown labels are ignored).
    # Tier labels are added by dependabot-triage.yml, not here.
    labels:
      - "dependencies"
      - "javascript"

    # Branch names: dependabot/npm_and_yarn/<group-or-dep>-<hash>
    pull-request-branch-name:
      separator: "/"

    groups:
      # ---- ONE PR for every patch-level bump across all directories ----------
      patch-only-safe:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "patch"

      # ---- ONE PR for security fixes (overrides the repo-level
      #      "grouped security updates" toggle; keeps them out of the patch PR)
      security-fixes:
        applies-to: "security-updates"
        patterns:
          - "*"

      # Minor and major bumps match no version-update group on purpose, so
      # Dependabot raises them as individual pull requests.
      #
      # Optional (undocumented combination — test on a branch before relying
      # on it): collapse "same dependency, N packages" minor bumps into one PR:
      #
      #   minor-per-dependency:
      #     applies-to: "version-updates"
      #     update-types: ["minor"]
      #     group-by: "dependency-name"

    ignore:
      # ---- Policy-frozen (CLAUDE.md Hard Constraints) -------------------------
      # React: patch only. The whole MFE mesh + forms-flow-web share one React
      # via the SystemJS import map; a minor/major here is a cross-repo change.
      - dependency-name: "react"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

      # Build system / bundler / runtime loader: majors are a planned project.
      - dependency-name: "webpack"
        update-types: ["version-update:semver-major"]
      - dependency-name: "webpack-cli"
        update-types: ["version-update:semver-major"]
      - dependency-name: "webpack-dev-server"
        update-types: ["version-update:semver-major"]
      - dependency-name: "webpack-merge"
        update-types: ["version-update:semver-major"]
      - dependency-name: "webpack-config-single-spa*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "single-spa*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "sass"
        update-types: ["version-update:semver-major"]
      - dependency-name: "sass-loader"
        update-types: ["version-update:semver-major"]

      # Intentional version drift between packages (never "align" it):
      - dependency-name: "jest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jest-environment-jsdom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "babel-jest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "ts-jest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-plugin-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "i18next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-i18next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "prettier"
        update-types: ["version-update:semver-major"]

      # Form engine + heavy shared-bundle libraries (components ships one
      # 4 MB bundle on every page): majors need a sized, reviewed effort.
      - dependency-name: "@aot-technologies/formiojs"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@aot-technologies/formio-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@mui/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "bpmn-js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "bootstrap"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-bootstrap"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-router-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "keycloak-js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@reduxjs/toolkit"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@tanstack/react-query"
        update-types: ["version-update:semver-major"]
      - dependency-name: "storybook"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@storybook/*"
        update-types: ["version-update:semver-major"]

  # ===========================================================================
  # Docker — base images of the 8 package Dockerfiles (node / nginx).
  # Patch bumps grouped; minor/major (e.g. node 16 → 20) come individually
  # because they change the build image and need a deliberate decision.
  # ===========================================================================
  - package-ecosystem: "docker"
    directories:
      - "/forms-flow-admin"
      - "/forms-flow-components"
      - "/forms-flow-integration"
      - "/forms-flow-nav"
      - "/forms-flow-review"
      - "/forms-flow-service"
      - "/forms-flow-submissions"
      - "/forms-flow-theme"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:30"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      docker-patch-only-safe:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "patch"

  # ===========================================================================
  # GitHub Actions — pins in .github/workflows (checkout, setup-node, aws, ...).
  # One PR for everything; action bumps are low-risk and CI validates them.
  # ===========================================================================
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    groups:
      github-actions-all:
        applies-to: "version-updates"
        patterns:
          - "*"
