# =============================================================================
# Dependabot configuration — forms-flow-ai-micro-front-ends
# -----------------------------------------------------------------------------
# Policy: security first, patches grouped, everything else in ONE batch PR.
# (see .github/DEPENDABOT.md and .github/workflows/dependabot-triage.yml)
#
#   security-fixes   ONE grouped PR, opened the moment a Dependabot alert has
#                    a fix (no schedule, no cooldown) → badge [🔒 SECURITY].
#                    Reviewed and merged before anything else. Always lands
#                    on the default branch.
#   patch-only-safe  ONE grouped PR across all npm packages, patch bumps only.
#                    Title: "Bump the patch-only-safe group across N directories
#                    with M updates" → badge [✅ PATCH-ONLY]. One review pass,
#                    merge.
#   minor-and-major  ONE batch PR with every remaining minor and major bump
#                    across all npm packages → badge [🟡 MINOR] or [🔴 MAJOR],
#                    whichever is the highest bump inside the batch. Reviewed
#                    entry by entry; an entry that is not ready is dropped with
#                    `@dependabot ignore <dependency> major version` (or
#                    `minor version`) and the batch is recreated without it.
#
# Net effect: at most three open Dependabot PRs per ecosystem (security,
# patch, batch) instead of one PR per dependency per directory.
#
# Repo facts this file encodes:
#   - 8 independently installed MFE packages + /scripts (CD helper). NOT a
#     workspace monorepo: each directory has its own package.json and
#     package-lock.json, so the ecosystem is `npm` with ONE multi-directory
#     update job (the groups span every directory).
#   - No `ignore` list on purpose: every available update is surfaced, so
#     nothing is missed. Majors for policy-frozen libraries (React, webpack,
#     single-spa, formio, the intentional jest/eslint/i18next drift; see
#     CLAUDE.md "Hard Constraints") land in the batch PR and are declined
#     there per dependency when not planned.
#   - Default branch is `develop`; no target-branch is set on purpose, because
#     security updates only ever target the default branch and a non-default
#     target-branch silently detaches the groups/labels from them.
#
# Manual refresh: Insights → Dependency graph → Dependabot → "Check for updates".
# Validation:     Insights → Dependency graph → Dependabot (shows config errors).
# =============================================================================
version: 2

updates:
  # ===========================================================================
  # npm — all micro-frontend packages + CD scripts, in ONE update job so every
  # group spans every directory ("across N directories").
  # ===========================================================================
  - package-ecosystem: "npm"
    directories:
      - "/forms-flow-admin"
      - "/forms-flow-components"
      - "/forms-flow-integration"
      - "/forms-flow-nav"
      - "/forms-flow-review"
      - "/forms-flow-service"
      - "/forms-flow-submissions"
      - "/forms-flow-theme"
      - "/scripts"

    # Daily: the patch group and the batch PR are updated in place, so a
    # daily check adds entries to open PRs instead of opening new ones.
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Kolkata"

    # Three grouped PRs never reach this; the limit is applied per directory
    # and only matters for stragglers that fall outside every group.
    open-pull-requests-limit: 10

    # Bump the range in package.json AND the lockfile (app behaviour). Without
    # this Dependabot may treat non-private packages as libraries and "widen"
    # ranges instead of bumping them.
    versioning-strategy: "increase"

    # Supply-chain cooldown: never take a release the day it is published.
    # Most malicious npm publishes are yanked within days; waiting costs little.
    # Security updates are exempt from cooldown.
    cooldown:
      default-days: 7
      semver-patch-days: 7
      semver-minor-days: 14
      semver-major-days: 30

    # Labels must already exist in the repo (unknown labels are ignored).
    # Tier labels are added by dependabot-triage.yml, not here.
    labels:
      - "dependencies"
      - "javascript"

    # Branch names: dependabot/npm_and_yarn/<group>-<hash>
    pull-request-branch-name:
      separator: "/"

    # Groups are matched in order; a dependency joins the first group it fits.
    groups:
      # ---- Security first: ONE PR for Dependabot security updates ------------
      #      (overrides the repo-level "grouped security updates" toggle and
      #      keeps them out of the patch and batch PRs)
      security-fixes:
        applies-to: "security-updates"
        patterns:
          - "*"

      # ---- ONE PR for every patch-level bump across all directories ----------
      patch-only-safe:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "patch"

      # ---- Everything else: ONE batch PR for all minor and major bumps -------
      # Title: "Bump the minor-and-major group across N directories with M
      # updates". The triage workflow badges it by the highest bump inside.
      minor-and-major:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "major"

  # ===========================================================================
  # Docker — base images of the 8 package Dockerfiles (node / nginx).
  # Patch bumps grouped; minor/major (e.g. node 16 → 20) in one batch PR
  # because they change the build image and need a deliberate decision.
  # ===========================================================================
  - package-ecosystem: "docker"
    directories:
      - "/forms-flow-admin"
      - "/forms-flow-components"
      - "/forms-flow-integration"
      - "/forms-flow-nav"
      - "/forms-flow-review"
      - "/forms-flow-service"
      - "/forms-flow-submissions"
      - "/forms-flow-theme"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "09:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      docker-patch-only-safe:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "patch"
      # One batch PR for every image bump across all 8 Dockerfiles.
      docker-minor-and-major:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "major"

  # ===========================================================================
  # GitHub Actions — pins in .github/workflows (checkout, setup-node, aws, ...).
  # One PR for everything; action bumps are low-risk and CI validates them.
  # ===========================================================================
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "09:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    groups:
      github-actions-all:
        applies-to: "version-updates"
        patterns:
          - "*"
